<!doctype html>
<!--
  LinkedIn Featured image, 1200 × 644 (LinkedIn's recommended size for a featured media card),
  set like the site's home cover: ultramarine field, Inter, a 12-column grid with a 48px margin
  and 24px gutter. The information line across the top, the statement in the middle, the name
  and title at the bottom left.

  Render with:
    chromium --headless=new --hide-scrollbars --window-size=1200,644 \
      --virtual-time-budget=5000 --screenshot=featured.png file://$PWD/featured.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 644px;
    overflow: hidden;
    background: #1c3fd1;
    color: #f1efe9;
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 24px;
    padding: 0 48px;
  }
  .info { padding-top: 40px; font-size: 22px; line-height: 30px; margin: 0; }
  .info dt { opacity: 0.7; }
  .info dd { margin: 0; }

  .statement {
    position: absolute;
    top: 230px;
    left: 0; right: 0;
    margin: 0;
    font-size: 44px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    text-wrap: pretty;
  }

  .foot {
    position: absolute;
    left: 0; right: 0; bottom: 40px;
    align-items: end;
  }
  .name {
    grid-column: 1 / 13;
    margin: 0 0 0 -0.06em;
    font-size: 150px;
    font-weight: 700;
    letter-spacing: -0.065em;
    line-height: 0.8;
    white-space: nowrap;
  }
  .role {
    grid-column: 1 / 13;
    margin: 18px 0 0;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
  }
</style>
</head>
<body>
  <dl class="info grid">
    <div style="grid-column: 1 / 4"><dt>Based in</dt><dd>Manaus, Brazil</dd></div>
    <div style="grid-column: 4 / 8"><dt>Works with</dt><dd>React, Next.js, Go, TypeScript</dd></div>
    <div style="grid-column: 9 / 13"><dt>Portfolio</dt><dd>ludihan.com</dd></div>
  </dl>

  <p class="statement grid" style="margin-top:0"><span style="grid-column: 4 / 12; display:block">I build web applications end to end, from the interface to the back-end and its tooling.</span></p>

  <div class="foot grid">
    <p class="name">Lucca Han</p>
    <p class="role">Software Engineer</p>
  </div>
</body>
</html>
